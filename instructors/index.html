<script>
/* ============================================================
   認定講師データ。新しい講師が加わったら:
   1. instructors/_template/ フォルダをコピーして
      instructors/[講師スラッグ]/ を作る
   2. 個別ページの中身（プロフィール・SNS・依頼ボタン）を編集する
   3. この配列に1項目追加する
   退会した講師は、この配列から項目を削除するだけで
   一覧・紹介ページから同時に消える。
   ============================================================ */
const instructors = [
  {
    name: "岡本 ゆかり",
    title: "Dream Bloom認定講師",
    photo: "../assets/img/founder-photo.jpg",
    link: "okamoto-yukari/index.html"
  },
  // 例:
  // {
  //   name: "山田 花子",
  //   title: "Dream Bloom認定講師",
  //   photo: "",
  //   link: "yamada-hanako/index.html"
  // },
];

const listEl = document.getElementById("instructor-list");
const emptyEl = document.getElementById("empty-message");

if (instructors.length === 0) {
  emptyEl.style.display = "block";
} else {
  listEl.innerHTML = instructors.map(i => `
    <a class="item-card" href="${i.link}" style="text-decoration:none;color:inherit;">
      <img class="instructor-photo" src="${i.photo || '../assets/img/placeholder-avatar.png'}" alt="${i.name}">
      <h3>${i.name}</h3>
      <p style="font-weight:700;color:var(--rose-deep);">${i.title}</p>
      <span class="item-link">プロフィールを見る →</span>
    </a>
  `).join("");
}
</script>
