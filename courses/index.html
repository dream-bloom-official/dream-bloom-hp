<script>
/* ============================================================
   講座データ。新しい講座が開講したら、この配列に1項目
   追加するだけでカードが自動的に増える。
   status: "open"（開講中） or "soon"（準備中）
   link  : 開講中の講座はLPのURL。準備中は "" でOK
   ============================================================ */
const courses = [
  {
    name: "HSP専門カウンセラー資格取得講座",
    status: "open",
    desc: "HSP・繊細な気質を持つ方に寄り添う専門知識を身につける講座です。",
    link: "https://hsp-counselor.netlify.app/"
  },
  {
    name: "心理カウンセラー資格取得講座",
    status: "soon",
    desc: "心理学の基礎からアドラー心理学まで、対人支援の土台を学ぶ講座です。",
    link: ""
  },
  {
    name: "カウンセリング・コーチング資格取得講座",
    status: "soon",
    desc: "傾聴と問いかけの技術で、相手の力を引き出すスキルを学びます。",
    link: ""
  },
  {
    name: "ビジネスコーチ講座",
    status: "soon",
    desc: "自分らしい働き方・稼ぎ方を、コーチングの視点から設計します。",
    link: ""
  }
];

const listEl = document.getElementById("course-list");
listEl.innerHTML = courses.map(c => `
  <div class="item-card">
    <span class="badge ${c.status}">${c.status === "open" ? "開講中" : "準備中"}</span>
    <h3>${c.name}</h3>
    <p>${c.desc}</p>
    ${c.status === "open"
      ? `<a class="item-link" href="${c.link}" target="_blank" rel="noopener">詳しく見る・申し込む →</a>`
      : `<span class="item-link disabled">近日公開予定</span>`
    }
  </div>
`).join("");
</script>
